<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kasir - Nota Charge</title>
  <link rel="stylesheet" href="css/style.css">
  <!-- CDN QRCodeJS yang stabil -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
</head>
<body>
  <div class="container">
    <h2>Aplikasi Kasir</h2>

    <form id="form-kasir">
      <label for="total-bayar">Total Pembayaran (Rp):</label>
      <input type="number" id="total-bayar" placeholder="Masukkan total bayar" required min="1">
      
      <button type="submit" id="btn-simpan">Simpan Nota & Buat QRIS</button>
    </form>

    <!-- Area Output Hasil Nota & QRIS -->
    <div id="area-nota" style="display: none; margin-top: 20px; border: 1px solid #ccc; padding: 15px; border-radius: 8px;">
      <h3>Nota Pembayaran</h3>
      <p id="nota-id"></p>
      <p id="nota-total"></p>
      
      <div id="qrcode-container" style="margin: 15px 0;">
        <p><strong>Scan QRIS untuk Membayar:</strong></p>
        <div id="qrcode"></div>
      </div>

      <button id="btn-bagikan" style="background-color: #25D366; color: white; padding: 10px 15px; border: none; border-radius: 5px; cursor: pointer;">
        Bagikan Nota
      </button>
    </div>
  </div>

  <script src="supabase.js"></script>
  <script src="js/qris.js"></script>
  <script src="js/kasir.js"></script>
</body>
</html>
