<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>Login Operator | Nota Charge</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<main class="login-stage">
  <div class="login-box">
    <div class="login-logo">
      <h1>⚡ Nota Charge</h1>
      <p>LOGIN OPERATOR</p>
    </div>
    <div id="message" class="notice hidden"></div>
    <form id="loginForm" class="form-grid">
      <div class="field">
        <label for="email">Email Admin</label>
        <input id="email" type="email" required autocomplete="email">
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input id="password" type="password" required autocomplete="current-password">
      </div>
      <button id="loginBtn" class="btn btn-primary full" type="submit">Masuk</button>
    </form>
  </div>
</main>

<script src="js/vendor-loader.js"></script>
<script src="supabase.js"></script>
<script src="js/auth.js"></script>
<script>
(async () => {
  const q = new URLSearchParams(location.search);
  if (q.get('error') === 'unauthorized') {
    showMessage(document.getElementById('message'), 'Akun ini bukan admin OMB.', 'error');
  }
  const { data: { session } } = await supabaseClient.auth.getSession();
  if (session && isAdminSession(session)) location.replace('kasir.html');
})();

document.getElementById('loginForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const msg = document.getElementById('message');
  const btn = document.getElementById('loginBtn');
  btn.disabled = true;
  btn.textContent = 'Memproses...';
  try {
    const { data, error } = await supabaseClient.auth.signInWithPassword({
      email: email.value.trim(),
      password: password.value
    });
    if (error) throw error;
    if (!isAdminSession(data.session)) {
      await supabaseClient.auth.signOut();
      throw new Error('Login berhasil, tetapi akun tidak memiliki role admin.');
    }
    location.replace('kasir.html');
  } catch (err) {
    showMessage(msg, err.message || 'Login gagal.', 'error');
    btn.disabled = false;
    btn.textContent = 'Masuk';
  }
});
</script>
</body>
</html>
